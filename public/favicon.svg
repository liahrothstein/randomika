<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Тень под грани для объема -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Тело кости (на прозрачном фоне) -->
  <rect 
    x="32" 
    y="32" 
    width="448" 
    height="448" 
    rx="96" 
    ry="96" 
    fill="#ffffff" 
    stroke="#e2e8f0" 
    stroke-width="12"
    filter="url(#shadow)"
  />

  <!-- Точки (выпало 5) -->
  <g fill="#0f172a">
    <!-- Верхняя левая -->
    <circle cx="144" cy="144" r="36" />
    <!-- Верхняя правая -->
    <circle cx="368" cy="144" r="36" />
    <!-- Центральная -->
    <circle cx="256" cy="256" r="36" />
    <!-- Нижняя левая -->
    <circle cx="144" cy="368" r="36" />
    <!-- Нижняя правая -->
    <circle cx="368" cy="368" r="36" />
  </g>
</svg>
